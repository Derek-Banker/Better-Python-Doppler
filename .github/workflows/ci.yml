name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Run test suite
        run: python -m pytest

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Remove stale build artifacts
        run: rm -rf build dist

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  install-from-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Install wheel in a clean environment and smoke test imports
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "from better_python_doppler import Doppler, Secrets, SecretsClient; client = Doppler(service_token='dp.st.smoke-token'); assert client.Secrets is client.secrets; assert isinstance(client.Secrets, Secrets); assert isinstance(client.secrets, SecretsClient)"
